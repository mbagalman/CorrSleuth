[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corrsleuth"
version = "0.1.0"
description = "A relationship diagnosis engine for pandas users."
authors = [{ name = "CorrSleuth Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
standard = [
    "dcor",
    "scikit-learn",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["corrsleuth*"]
