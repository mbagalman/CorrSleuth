name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin the ruff version so lint results are reproducible; the rule set
      # itself is pinned in pyproject.toml ([tool.ruff.lint] select).
      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Run ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the standard extra so pandas/numpy/scipy/dcor/scikit-learn are
      # importable; the mypy version is pinned here for reproducible results
      # (config lives in pyproject.toml [tool.mypy]).
      - name: Install package and mypy
        run: pip install ".[standard]" mypy==1.20.2

      - name: Run mypy
        run: mypy

  test:
    name: ${{ matrix.install }} / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        install:
          - lite
          - standard
        include:
          # One cell per non-Linux OS (the package is pure Python, so a
          # single modern-Python cell each is enough to catch platform issues).
          - os: windows-latest
            python-version: "3.13"
            install: standard
          - os: macos-latest
            python-version: "3.13"
            install: standard
          # One cell with real statsmodels so the optional LOWESS plotting
          # path is exercised against the real library, not the test mock.
          - os: ubuntu-latest
            python-version: "3.13"
            install: statsmodels

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (lite)
        if: matrix.install == 'lite'
        run: pip install ".[dev]"

      - name: Install package (standard)
        if: matrix.install == 'standard'
        run: pip install ".[standard,dev]"

      - name: Install package (standard + statsmodels)
        if: matrix.install == 'statsmodels'
        run: pip install ".[standard,dev]" statsmodels

      - name: Run pytest
        run: pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install every optional dependency so all code paths (distance
      # correlation, mutual information, LOWESS plotting) are exercised; the
      # coverage floor is enforced via [tool.coverage.report] fail_under.
      - name: Install package with all extras
        run: pip install ".[standard,dev]" statsmodels

      - name: Run pytest with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: build & twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Verify sdist does not ship the test suite
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '/tests/'; then
            echo "sdist unexpectedly contains test files" >&2
            exit 1
          fi
