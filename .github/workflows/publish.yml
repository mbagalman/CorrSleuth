# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored in
# the repo. One-time setup on PyPI is required before the first release:
# pypi.org → your project (or "pending publishers" for a brand-new project) →
# add a trusted publisher with:
#   owner: mbagalman, repository: CorrSleuth,
#   workflow: publish.yml, environment: pypi
# Then create a GitHub environment named "pypi" in the repo settings and cut a
# GitHub release whose tag matches the version in corrsleuth/__init__.py
# (e.g. tag v0.2.0) to trigger this workflow.
#
# Rehearsal: running this workflow manually (workflow_dispatch) publishes to
# TestPyPI instead — same build and checks, different index — via the
# "testpypi" environment. That needs its own trusted publisher on
# test.pypi.org (same owner/repository/workflow, environment: testpypi).
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # rehearsal -> TestPyPI only; real releases go via a GitHub release

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail fast if the release tag and the packaged version disagree, so a
      # release tagged v0.3.0 while __init__ still says 0.2.0 cannot publish the
      # wrong version under the wrong release page (C8 #1). Reads __version__ from
      # source (no install needed) and expects the tag to be "v<version>".
      # Skipped for workflow_dispatch rehearsals, which have no release tag.
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import re, pathlib; print(re.search(r'''__version__\s*=\s*['\"]([^'\"]+)['\"]''', pathlib.Path('corrsleuth/__init__.py').read_text()).group(1))")
          echo "Package version: $VERSION | Release tag: $TAG"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package version 'v$VERSION'. Update corrsleuth/__init__.py or retag."
            exit 1
          fi

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Rehearsal upload to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version can only be uploaded once per index; let a re-run of the
          # rehearsal succeed as a no-op instead of failing the workflow.
          skip-existing: true
